<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Вентик</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1a30; overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #mute { position: fixed; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 22px; border: 0;
          background: rgba(0,0,0,.28); color: #fff; font-size: 20px; line-height: 44px; padding: 0; cursor: pointer; z-index: 2; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="Звук">🔊</button>
<script>
(() => {
  "use strict";
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const muteBtn = document.getElementById("mute");

  // ---------- Мир и масштаб ----------
  const H = 640;               // логическая высота
  let W = 400, scale = 1, dpr = 1;
  const GROUND = 80;           // высота крыши/земли
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const vw = window.innerWidth, vh = window.innerHeight;
    cv.width = Math.round(vw * dpr);
    cv.height = Math.round(vh * dpr);
    scale = cv.height / H;
    W = Math.max(320, Math.min(1000, cv.width / scale));
    buildCity();
  }

  // ---------- Параметры ----------
  const GRAVITY = 1500, FLAP = -430, MAX_FALL = 700;
  const DUCT_W = 74, GAP_START = 170, GAP_MIN = 138, SPACING = 230;
  const SPEED_START = 165, SPEED_MAX = 250;
  const R = 17; // радиус Вентика

  // ---------- Состояние ----------
  let state = "menu"; // menu | play | over
  let t = 0, overAt = 0, flash = 0;
  let speed = SPEED_START, gap = GAP_START;
  let score = 0, best = 0, newBest = false;
  let ducts = [], puffs = [];
  let groundX = 0, cityX = 0, cloudX = 0;
  const p = { x: 0, y: 0, vy: 0, rot: 0, spin: 0, spinV: 8 };
  try { best = +localStorage.getItem("ventik_best") || 0; } catch (e) {}

  function reset() {
    p.x = Math.min(W * 0.3, 140); p.y = H * 0.42; p.vy = 0; p.rot = 0; p.spinV = 8;
    ducts = []; puffs = []; score = 0; newBest = false;
    speed = SPEED_START; gap = GAP_START;
    let x = W + 120;
    for (let i = 0; i < 6; i++) { ducts.push(makeDuct(x)); x += SPACING; }
  }
  function makeDuct(x) {
    const minTop = 70, maxTop = H - GROUND - gap - 70;
    const top = minTop + Math.random() * (maxTop - minTop);
    return { x, top, gap, passed: false };
  }

  // ---------- Звук ----------
  let ac = null, muted = false;
  try { muted = localStorage.getItem("ventik_mute") === "1"; } catch (e) {}
  muteBtn.textContent = muted ? "🔇" : "🔊";
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === "suspended") ac.resume().catch(() => {});
    return ac;
  }
  function beep(f1, f2, dur, type = "square", vol = 0.08) {
    if (muted) return; const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), n = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(f1, n); o.frequency.exponentialRampToValueAtTime(f2, n + dur);
    g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
    o.connect(g).connect(a.destination); o.start(n); o.stop(n + dur + 0.02);
  }
  const sFlap = () => beep(420, 760, 0.09, "triangle", 0.09);
  const sScore = () => { beep(880, 880, 0.07, "square", 0.05); setTimeout(() => beep(1320, 1320, 0.09, "square", 0.05), 70); };
  const sHit = () => { beep(220, 60, 0.35, "sawtooth", 0.1); };
  muteBtn.addEventListener("pointerdown", e => {
    e.stopPropagation(); muted = !muted; muteBtn.textContent = muted ? "🔇" : "🔊";
    try { localStorage.setItem("ventik_mute", muted ? "1" : "0"); } catch (err) {}
    if (!muted) audio();
  });

  // ---------- Управление ----------
  function press() {
    audio();
    if (state === "menu") { state = "play"; reset(); flap(); return; }
    if (state === "play") { flap(); return; }
    if (state === "over" && t - overAt > 0.6) { state = "menu"; reset(); }
  }
  function flap() {
    p.vy = FLAP; p.spinV = 38; sFlap();
    for (let i = 0; i < 4; i++) puffs.push({ x: p.x - 4, y: p.y + R * 0.6, vx: -60 - Math.random() * 60, vy: 40 + Math.random() * 60, life: 0.45, max: 0.45, r: 3 + Math.random() * 3 });
  }
  cv.addEventListener("pointerdown", e => { e.preventDefault(); press(); });
  window.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter") { e.preventDefault(); if (!e.repeat) press(); }
  });
  document.addEventListener("contextmenu", e => e.preventDefault());

  // ---------- Логика ----------
  function update(dt) {
    t += dt;
    if (flash > 0) flash -= dt;
    const moving = state !== "over";
    if (moving) {
      groundX = (groundX + speed * dt) % 48;
      cityX += speed * 0.25 * dt;
      cloudX += speed * 0.08 * dt;
    }
    p.spin += p.spinV * dt;
    p.spinV += (10 - p.spinV) * Math.min(1, dt * 3);

    if (state === "menu") {
      p.y = H * 0.42 + Math.sin(t * 3) * 10; p.rot = 0;
    } else if (state === "play") {
      p.vy = Math.min(MAX_FALL, p.vy + GRAVITY * dt);
      p.y += p.vy * dt;
      const target = p.vy < 0 ? -0.4 : Math.min(1.35, p.vy / 450);
      p.rot += (target - p.rot) * Math.min(1, dt * (p.vy < 0 ? 14 : 5));

      for (const d of ducts) {
        d.x -= speed * dt;
        if (!d.passed && d.x + DUCT_W < p.x - R) {
          d.passed = true; score++; sScore();
          speed = Math.min(SPEED_MAX, SPEED_START + score * 2.2);
          gap = Math.max(GAP_MIN, GAP_START - score * 0.9);
        }
      }
      if (ducts.length && ducts[0].x < -DUCT_W - 20) {
        ducts.shift();
        ducts.push(makeDuct(ducts[ducts.length - 1].x + SPACING));
      }
      // столкновения
      if (p.y - R < -40) { p.y = -40 + R; p.vy = 0; }
      if (p.y + R > H - GROUND) { p.y = H - GROUND - R; die(); }
      for (const d of ducts) {
        if (hitRect(d.x, -100, DUCT_W, d.top + 100) || hitRect(d.x, d.top + d.gap, DUCT_W, H)) { die(); break; }
      }
    } else if (state === "over") {
      if (p.y + R < H - GROUND) {
        p.vy = Math.min(MAX_FALL * 1.3, p.vy + GRAVITY * dt);
        p.y = Math.min(H - GROUND - R, p.y + p.vy * dt);
        p.rot += (1.5 - p.rot) * Math.min(1, dt * 6);
      }
      p.spinV += (0 - p.spinV) * Math.min(1, dt * 2);
    }
    for (const q of puffs) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
    puffs = puffs.filter(q => q.life > 0);
  }
  function hitRect(rx, ry, rw, rh) {
    const r = R - 3; // чуть прощаем
    const cx = Math.max(rx, Math.min(p.x, rx + rw)), cy = Math.max(ry, Math.min(p.y, ry + rh));
    const dx = p.x - cx, dy = p.y - cy;
    return dx * dx + dy * dy < r * r;
  }
  function die() {
    if (state !== "play") return;
    state = "over"; overAt = t; flash = 0.15; sHit();
    if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
    if (score > best) { best = score; newBest = true; try { localStorage.setItem("ventik_best", best); } catch (e) {} }
  }

  // ---------- Фон: город ----------
  let city1 = [], city2 = [];
  function buildCity() {
    const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(12345);
    city1 = []; city2 = [];
    let x = 0; while (x < 1400) { const w = 40 + rnd() * 60; city1.push({ x, w, h: 90 + rnd() * 140, win: rnd() }); x += w + 4; }
    x = 0; while (x < 1400) { const w = 30 + rnd() * 50; city2.push({ x, w, h: 50 + rnd() * 90, win: rnd() }); x += w + 2; }
  }
  const cityLen = 1400;

  // ---------- Отрисовка ----------
  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    // небо
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1b2a4a"); g.addColorStop(0.55, "#3d5a8c"); g.addColorStop(1, "#f0a46a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // луна
    ctx.fillStyle = "rgba(255,240,210,.9)"; ctx.beginPath(); ctx.arc(W * 0.78, 110, 26, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,240,210,.12)"; ctx.beginPath(); ctx.arc(W * 0.78, 110, 46, 0, 7); ctx.fill();
    // облака
    ctx.fillStyle = "rgba(255,255,255,.12)";
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 260 - cloudX) % (W + 300) + W + 300) % (W + 300) - 150, cy = 70 + (i * 53) % 170;
      cloud(cx, cy, 1 + (i % 3) * 0.3);
    }
    // город
    drawCity(city1, cityX * 0.6, "#2a3d63", H - GROUND, true);
    drawCity(city2, cityX, "#1f2e4d", H - GROUND, false);

    // воздуховоды
    for (const d of ducts) drawDuct(d);

    // частицы
    for (const q of puffs) {
      ctx.globalAlpha = Math.max(0, q.life / q.max) * 0.7;
      ctx.fillStyle = "#dff3ff"; ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1.6 - q.life / q.max), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawGround();
    drawVentik();

    if (state === "play" || state === "over") bigText(String(score), W / 2, 90, 56);
    if (state === "menu") drawMenu();
    if (state === "over") drawOver();

    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash / 0.15 * 0.7})`; ctx.fillRect(0, 0, W, H); }
  }
  function cloud(x, y, s) {
    ctx.beginPath();
    ctx.ellipse(x, y, 40 * s, 14 * s, 0, 0, 7); ctx.ellipse(x + 26 * s, y - 8 * s, 26 * s, 14 * s, 0, 0, 7);
    ctx.ellipse(x - 24 * s, y - 4 * s, 22 * s, 11 * s, 0, 0, 7); ctx.fill();
  }
  function drawCity(arr, off, color, base, windows) {
    const o = off % cityLen;
    for (let k = -1; k <= Math.ceil(W / cityLen) + 1; k++) {
      for (const b of arr) {
        const x = b.x + k * cityLen - o; if (x > W || x + b.w < 0) continue;
        ctx.fillStyle = color; ctx.fillRect(x, base - b.h, b.w, b.h);
        if (windows) {
          ctx.fillStyle = "rgba(255,214,140,.35)";
          for (let wy = base - b.h + 12; wy < base - 14; wy += 18)
            for (let wx = x + 7; wx < x + b.w - 9; wx += 13)
              if (((wx * 7 + wy * 3 + b.win * 100) | 0) % 5 === 0) ctx.fillRect(wx, wy, 5, 8);
        }
      }
    }
  }
  function drawDuct(d) {
    const x = d.x, w = DUCT_W;
    duct(x, -10, w, d.top + 10, true);
    duct(x, d.top + d.gap, w, H - GROUND - (d.top + d.gap), false);
  }
  function duct(x, y, w, h, top) {
    if (h <= 0) return;
    // тело — оцинковка
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, "#7c8794"); g.addColorStop(0.25, "#d5dde5"); g.addColorStop(0.45, "#aeb8c3");
    g.addColorStop(0.75, "#9aa5b1"); g.addColorStop(1, "#6b7581");
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    // зиги (рёбра жёсткости)
    ctx.strokeStyle = "rgba(60,70,82,.35)"; ctx.lineWidth = 1.5;
    for (let yy = (top ? y + h - 46 : y + 46); top ? yy > y : yy < y + h; yy += top ? -38 : 38) {
      ctx.beginPath(); ctx.moveTo(x + 3, yy); ctx.lineTo(x + w - 3, yy); ctx.stroke();
    }
    // фланец на торце
    const fy = top ? y + h - 16 : y, fx = x - 7, fw = w + 14;
    const fg = ctx.createLinearGradient(fx, 0, fx + fw, 0);
    fg.addColorStop(0, "#5d6772"); fg.addColorStop(0.3, "#c3ccd5"); fg.addColorStop(1, "#4f5862");
    ctx.fillStyle = fg; ctx.fillRect(fx, fy, fw, 16);
    ctx.strokeStyle = "#3b434c"; ctx.lineWidth = 2; ctx.strokeRect(fx + 1, fy + 1, fw - 2, 14);
    // болты
    ctx.fillStyle = "#3b434c";
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(fx + 9 + i * (fw - 18) / 3, fy + 8, 2.4, 0, 7); ctx.fill(); }
    // решётка на торце
    const gy = top ? fy + 16 : fy - 0;
    ctx.fillStyle = "rgba(20,26,34,.55)"; ctx.fillRect(x + 6, top ? gy - 3 : gy, w - 12, 3);
    // контур
    ctx.strokeStyle = "rgba(40,48,58,.8)"; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y, w - 2, h);
  }
  function drawGround() {
    const y = H - GROUND;
    ctx.fillStyle = "#3a3f47"; ctx.fillRect(0, y, W, GROUND);
    ctx.fillStyle = "#565d68"; ctx.fillRect(0, y, W, 10);
    ctx.fillStyle = "#e0b43a";
    for (let x = -groundX; x < W + 48; x += 48) {
      ctx.beginPath(); ctx.moveTo(x, y + 10); ctx.lineTo(x + 24, y + 10); ctx.lineTo(x + 14, y + 20); ctx.lineTo(x - 10, y + 20); ctx.fill();
    }
    ctx.fillStyle = "#2c3036"; ctx.fillRect(0, y + 20, W, 3);
    ctx.fillStyle = "rgba(255,255,255,.05)";
    for (let x = -groundX * 1; x < W + 48; x += 96) ctx.fillRect(x, y + 40, 50, 4);
  }
  function drawVentik() {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    // тень/обод
    ctx.fillStyle = "#1f6f8b"; ctx.beginPath(); ctx.arc(0, 0, R + 4, 0, 7); ctx.fill();
    const rg = ctx.createRadialGradient(-5, -6, 2, 0, 0, R + 3);
    rg.addColorStop(0, "#7fe0ff"); rg.addColorStop(1, "#2aa6cf");
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, R + 2, 0, 7); ctx.fill();
    ctx.fillStyle = "#123a4a"; ctx.beginPath(); ctx.arc(0, 0, R - 2, 0, 7); ctx.fill();
    // лопасти
    ctx.save(); ctx.rotate(p.spin);
    const blur = Math.min(1, Math.abs(p.spinV) / 40);
    ctx.fillStyle = `rgba(230,245,255,${0.95 - blur * 0.45})`;
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath(); ctx.ellipse(0, -8, 4.5, 8, 0.35, 0, 7); ctx.fill();
    }
    if (blur > 0.4) { ctx.fillStyle = `rgba(230,245,255,${blur * 0.18})`; ctx.beginPath(); ctx.arc(0, 0, R - 3, 0, 7); ctx.fill(); }
    ctx.restore();
    // ступица
    ctx.fillStyle = "#ffcf4a"; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.fill();
    // глаза
    const dead = state === "over";
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(7, -R - 1, 6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-4, -R + 1, 5, 0, 7); ctx.fill();
    ctx.strokeStyle = "#0e2a36"; ctx.fillStyle = "#0e2a36"; ctx.lineWidth = 2;
    if (dead) {
      cross(7, -R - 1, 3); cross(-4, -R + 1, 2.5);
    } else {
      ctx.beginPath(); ctx.arc(8.5, -R - 1, 2.6, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(-2.6, -R + 1, 2.2, 0, 7); ctx.fill();
    }
    // хвостик-шнур
    ctx.strokeStyle = "#1f6f8b"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-R - 2, 4);
    ctx.quadraticCurveTo(-R - 12, 10 + Math.sin(t * 12) * 4, -R - 18, 4 + Math.sin(t * 12 + 1) * 5); ctx.stroke();
    ctx.restore();
  }
  function cross(x, y, s) { ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke(); }

  function bigText(s, x, y, size, color = "#fff") {
    ctx.font = `900 ${size}px system-ui, -apple-system, Roboto, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineJoin = "round"; ctx.lineWidth = size / 6; ctx.strokeStyle = "#13203a";
    ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
  }
  function smallText(s, x, y, size, color = "#fff", weight = 700) {
    ctx.font = `${weight} ${size}px system-ui, -apple-system, Roboto, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = color; ctx.fillText(s, x, y);
  }
  function panel(x, y, w, h) {
    ctx.fillStyle = "rgba(15,26,48,.78)"; roundRect(x, y, w, h, 18); ctx.fill();
    ctx.strokeStyle = "rgba(127,224,255,.5)"; ctx.lineWidth = 2; roundRect(x, y, w, h, 18); ctx.stroke();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawMenu() {
    bigText("ВЕНТИК", W / 2, 150, 58, "#7fe0ff");
    smallText("пролети между воздуховодами", W / 2, 198, 17, "rgba(255,255,255,.85)", 600);
    const a = 0.55 + Math.sin(t * 5) * 0.45;
    ctx.globalAlpha = a; smallText("👆 Нажми, чтобы лететь", W / 2, H * 0.58, 22, "#fff", 800); ctx.globalAlpha = 1;
    if (best > 0) smallText(`Рекорд: ${best}`, W / 2, H * 0.58 + 40, 18, "#ffcf4a", 700);
  }
  function drawOver() {
    const k = Math.min(1, (t - overAt) / 0.35), pw = 260, ph = 200;
    const x = W / 2 - pw / 2, y = H * 0.3 + (1 - k) * 40;
    ctx.globalAlpha = k;
    bigText("АВАРИЯ!", W / 2, y - 34, 40, "#ff7a6a");
    panel(x, y, pw, ph);
    smallText("Счёт", W / 2 - 60, y + 36, 16, "rgba(255,255,255,.7)", 600);
    smallText("Рекорд", W / 2 + 60, y + 36, 16, "rgba(255,255,255,.7)", 600);
    smallText(String(score), W / 2 - 60, y + 76, 40, "#fff", 900);
    smallText(String(best), W / 2 + 60, y + 76, 40, "#ffcf4a", 900);
    if (newBest) smallText("★ новый рекорд ★", W / 2, y + 120, 17, "#ffcf4a", 800);
    else smallText(rank(score), W / 2, y + 120, 16, "#7fe0ff", 700);
    if (t - overAt > 0.6) {
      const a = 0.55 + Math.sin(t * 5) * 0.45;
      ctx.globalAlpha = k * a; smallText("Нажми, чтобы ещё раз", W / 2, y + 166, 18, "#fff", 800);
    }
    ctx.globalAlpha = 1;
  }
  function rank(s) {
    if (s < 3) return "Пусконаладка не пройдена";
    if (s < 10) return "Стажёр ПТО";
    if (s < 25) return "Монтажник";
    if (s < 50) return "Главный инженер";
    return "Легенда вентиляции";
  }

  // ---------- Цикл ----------
  let last = performance.now(), acc = 0;
  const STEP = 1 / 120;
  function loop(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.1) dt = 0.1;
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    draw();
    requestAnimationFrame(loop);
  }
  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", () => { last = performance.now(); });
  resize(); reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
